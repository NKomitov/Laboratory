<!DOCTYPE html>

<head>

<body>

<header>
    <nav class="navbar">
        <a href="/Laboratory/src/main/resources/frontend/main_page/index.html" class="nav-logo">

    </nav>

<div class="container">
    <h3>Log in</h3>
    <form>
        <label for="login"></label>
        <input type="text"  id="login" autocomplete="username"

        <button type="submit">Log in</button>
    </form>
</div>
